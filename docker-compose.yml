# Highland Vault — LOCAL DEVELOPMENT infrastructure only (ADR-0001).
# Not a production deployment definition.
#
# Values come from .env (copy .env.example). All ports bind to 127.0.0.1 only.

name: highland-vault

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Consumed by infra/docker/postgres/init/01-roles-and-database.sh on first start.
      HV_DB_NAME: ${HV_DB_NAME:-highland_vault}
      HV_OWNER_PASSWORD: ${HV_OWNER_PASSWORD:?set HV_OWNER_PASSWORD in .env}
      HV_APP_PASSWORD: ${HV_APP_PASSWORD:?set HV_APP_PASSWORD in .env}
    # The integration suite runs several test files at once, each with its own
    # database and pool, and the ticket-engine gates alone open sixty
    # connections to prove allocation under real contention. That peaks around
    # 80 of PostgreSQL's default 100, so adding a test file was enough to start
    # failing runs with "timeout exceeded when trying to connect". Headroom is
    # cheaper than shrinking the concurrency the gates exist to exercise.
    command: ['postgres', '-c', 'max_connections=200']
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume is mounted at the parent directory.
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${HV_DB_NAME:-highland_vault}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across container restarts.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
